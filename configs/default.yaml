paths:
  data_dir: data
  artifact_dir: artifacts

experiment:
  seed: 42
  cv_splits: 5

features:
  use_target_log: true
  use_hypothesis_checks: true

models:
  ridge:
    alpha: 12.0
  lasso:
    alpha: 0.0007
  et:
    n_estimators: 1200
    max_depth: 12
    min_samples_leaf: 2
    random_state: 42
  xgb:
    n_estimators: 900
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 1.0
    random_state: 42
  hgb:
    learning_rate: 0.05
    max_depth: 6
    max_iter: 300
    min_samples_leaf: 20
    random_state: 42
  catboost:
    iterations: 1800
    learning_rate: 0.03
    depth: 6
    loss_function: RMSE
    random_seed: 42
  mlp:
    hidden_layer_sizes: [128, 64]
    alpha: 0.0005
    learning_rate_init: 0.001
    max_iter: 500
    n_iter_no_change: 20
    random_state: 42
  torch:
    hidden_layers: [128, 64]
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 32
    max_epochs: 100
    patience: 12
    val_fraction: 0.2
    random_state: 42

output:
  submission_name: submission_baseline.csv